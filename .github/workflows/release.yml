name: Release image

# Publishes the container image to GitHub Container Registry when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      - name: The base image is the one the patch was made for
        run: |
          docker pull "$(awk '/^FROM /{print $2}' Dockerfile)"
          bash scripts/verify-image.sh
      - name: Smoke test (starts the image on an empty data folder)
        run: bash scripts/smoke-image.sh "$IMAGE:$VERSION"
      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
