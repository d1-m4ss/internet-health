name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Shell syntax
        run: bash -n src/netprobe-unraid-notify.sh && bash -n scripts/smoke-image.sh && bash -n unraid-plugin/install.sh && bash -n unraid-plugin/remove.sh

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Network-failure simulator (real probe loop, bridge and queue; nothing leaves the machine)
        run: python tests/simulate_network.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Browser tests (UI, both styles, both languages)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/test_ui.cjs
          node tests/test_mobile_nav.cjs
          node tests/test_speedtest_ui.cjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (this pulls the pinned base)
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t internet-health:ci .
      - name: Start the image on an empty data folder
        run: bash scripts/smoke-image.sh internet-health:ci
